[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentfence-lab"
dynamic = ["version"]
description = "Evidence-first, offline-first security regression testing for AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AgentFence Lab contributors" }]
keywords = ["ai-security", "coding-agents", "prompt-injection", "security-testing", "sandbox"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
agentfence = "agentfence.cli:main"

[project.urls]
Homepage = "https://github.com/BhuwanJoshi-01/agentfence-lab"
Issues = "https://github.com/BhuwanJoshi-01/agentfence-lab/issues"
Security = "https://github.com/BhuwanJoshi-01/agentfence-lab/blob/main/SECURITY.md"

[tool.hatch.version]
path = "src/agentfence/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfence"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "isolation: needs a verified rootless runtime on a trusted runner (skipped elsewhere)",
]

[tool.coverage.run]
source = ["agentfence"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Spec documents contain illustrative pseudocode; keep them byte-identical.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PTH", "N", "PL", "TRY", "BLE", "A",
]
ignore = [
    "PLR2004",  # magic values are fine in tests and exit-code tables
    "TRY003",   # long messages in exceptions are intentional: errors propose a next step
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how pytest works
    "S603",    # tests spawn our own CLI with argument arrays
    "S311",    # seeded random.Random is used for deterministic shuffles, not crypto
    "PLR0913",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/agentfence"]
