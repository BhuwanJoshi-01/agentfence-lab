# Publishes website/ to GitHub Pages. The site is static: no build tool, no scripts.
# Images come from docs/images so the README and the site show the same real screenshots.
name: Pages

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp website/index.html website/styles.css website/favicon.svg website/social-card.png _site/
          cp docs/images/demo.gif docs/images/dashboard-runs.png docs/images/dashboard-attempt.png _site/images/
          ls -lR _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
